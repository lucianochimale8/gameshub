<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎮 GameHub</h1>
        <p>Mi biblioteca de videojuegos</p>
    </header>
    <main> 
        <section class="toolbar"> 
            <input
                type="search"
                id="searchInput"
                placeholder="Buscar un videojuego..."
            >
        </section>

        <section class="form-section">
            <h2>Agregar videojuego</h2>

            <form id="gameForm">
                <input
                    type="text"
                    id="gameName"
                    placeholder="Nombre del videojuego"
                    required
                >

                <input
                    type="text"
                    id="gameGenre"
                    placeholder="Género"
                    required
                >

                <input
                    type="number"
                    id="gameYear"
                    placeholder="Año"
                    min="1950"
                    max="2100"
                    required
                >

                <button type="submit">Agregar juego</button>
            </form>
        </section>

        <section>
            <h2>Mi biblioteca</h2>
            <div id="gamesList" class="games"></div>
            <p id="emptyMessage" hidden>No se encontraron videojuegos.</p>
        </section>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
